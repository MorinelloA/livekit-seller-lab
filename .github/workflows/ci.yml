# Checks every push and pull request. Nothing here needs LiveKit or Deepgram
# keys, and nothing places a call: the tests cover the rules around the calls.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Pages and API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          # The tests are TypeScript files that Node runs as they are.
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Types (pages, then the Worker)
        run: pnpm typecheck
      - name: Tests (timeline, recordings, kit rules, the Worker's API)
        run: pnpm test
      - name: Static export
        run: pnpm build

  agent:
    name: Agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # The version the agent's Dockerfile builds with.
          python-version: '3.13'
          cache: pip
          cache-dependency-path: agent/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (scoring rules, Juniper's inputs)
        run: pytest -q
